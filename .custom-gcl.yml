# Кастомный бинарник golangci-lint с NilAway (не входит в стандартный бинарник из-за ложных срабатываний).
# Сборка: golangci-lint custom
# Запуск: ./custom-gcl run ./...
version: v2.7.2
name: custom-gcl
plugins:
  - module: go.uber.org/nilaway
    import: go.uber.org/nilaway/cmd/gclplugin
    # Фиксируем pseudo-version для воспроизводимых CI-сборок (у nilaway пока нет semver-тегов).
    version: v0.0.0-20260724203407-f4f8ac24c032
