# App only — connects to PostgreSQL on external Docker network `infra`.
# Requires: ~/r/sandbox/infra/postgres/ running with network `infra`.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d

services:
  go-uptime:
    build: .
    container_name: go-uptime
    restart: unless-stopped
    env_file: .env
    environment:
      GO_UPTIME_DATABASE_HOST: postgresql
      GO_UPTIME_DATABASE_PORT: 5432
    ports:
      - "${GO_UPTIME_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra

networks:
  infra:
    external: true
    name: infra
