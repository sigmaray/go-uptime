# Только приложение — подключается к PostgreSQL во внешней Docker-сети `infra`.
# Требуется: запущенный ~/r/sandbox/infra/postgres/ с сетью `infra`.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d

services:
  go-uptime:
    build: .
    container_name: go-uptime
    restart: unless-stopped
    env_file: .env
    environment:
      GO_UPTIME_DATABASE_HOST: postgresql
      GO_UPTIME_DATABASE_PORT: 5432
    ports:
      - "${GO_UPTIME_HTTP_PORT:-8080}:8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra

networks:
  infra:
    external: true
    name: infra
