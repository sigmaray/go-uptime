{{ define "admin/monitors/new.html" }}
<h2 class="mb-4">Add Monitor URL</h2>
<form method="POST" action="/admin/monitors" class="col-md-8">
    <div class="mb-3">
        <label class="form-label" for="name">Name <span class="text-muted fw-normal">(optional)</span></label>
        <input type="text" class="form-control" id="name" name="name" value="{{ .Input.Name }}" aria-describedby="nameHelp">
        <div id="nameHelp" class="form-text">If left empty, the site hostname from the URL is used (for example, <code>example.com</code>).</div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="url">URL <span class="text-danger" aria-hidden="true">*</span><span class="visually-hidden">required</span></label>
        <input type="url" class="form-control" id="url" name="url" value="{{ .Input.URL }}" placeholder="https://example.com" required aria-required="true">
        <div class="form-text">Required. Must be a valid HTTP or HTTPS address.</div>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="/admin/monitors" class="btn btn-link">Cancel</a>
</form>
{{ end }}
