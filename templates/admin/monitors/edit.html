{{ define "admin/monitors/edit.html" }}
<h2 class="mb-4">Edit Monitor URL</h2>
<form method="POST" action="/admin/monitors/{{ .Monitor.ID }}" class="col-md-8">
    <input type="hidden" name="return_to" value="{{ .ReturnTo }}">
    <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ .Monitor.Name }}">
    </div>
    <div class="mb-3">
        <label class="form-label" for="url">URL</label>
        <input type="url" class="form-control" id="url" name="url" value="{{ .Monitor.URL }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="check_interval_seconds">Check interval (seconds) <span class="text-muted fw-normal">(optional)</span></label>
        <input type="number" class="form-control" id="check_interval_seconds" name="check_interval_seconds"
               value="{{ checkIntervalFormValue .Monitor }}" min="10" max="86400" aria-describedby="checkIntervalHelp">
        <div id="checkIntervalHelp" class="form-text">Leave empty to use the global check interval from Settings.</div>
    </div>
    {{ template "admin/monitors/notification_fields.html" . }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ .ReturnTo }}" class="btn btn-link">Cancel</a>
</form>
{{ end }}
