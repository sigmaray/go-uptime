{{ define "admin/monitors/edit.html" }}
<h2 class="mb-4">Edit Monitor URL</h2>
<form method="POST" action="/admin/monitors/{{ .Monitor.ID }}" class="col-md-8">
    <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ .Monitor.Name }}">
    </div>
    <div class="mb-3">
        <label class="form-label" for="url">URL</label>
        <input type="url" class="form-control" id="url" name="url" value="{{ .Monitor.URL }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/monitors" class="btn btn-link">Cancel</a>
</form>
{{ end }}
