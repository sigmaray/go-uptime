{{ define "admin/logs/index.html" }}
<h2 class="mb-4">Application Logs</h2>
<p class="text-muted">Last 200 significant application events kept in memory.</p>
<div class="table-responsive">
    <table class="table table-sm table-striped log-table">
        <thead>
            <tr><th>Time</th><th>Category</th><th>Message</th></tr>
        </thead>
        <tbody>
            {{ range .Entries }}
            <tr>
                <td class="text-nowrap">{{ .Time.Format "2006-01-02 15:04:05" }}</td>
                <td><span class="badge text-bg-secondary">{{ .Category }}</span></td>
                <td>{{ .Message }}</td>
            </tr>
            {{ else }}
            <tr><td colspan="3" class="text-muted">No events recorded yet.</td></tr>
            {{ end }}
        </tbody>
    </table>
</div>
{{ end }}
