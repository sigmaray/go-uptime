{{ define "app/settings/index.html" }}
<h2 class="mb-4">Monitoring Settings</h2>
<form method="POST" action="/app/settings" class="col-md-6 settings-form">
    <div class="mb-3">
        <label class="form-label" for="check_interval_seconds">Check interval (seconds)</label>
        <input type="number" class="form-control" id="check_interval_seconds" name="check_interval_seconds"
               value="{{ .CheckIntervalSeconds }}" min="10" max="86400" required>
        <div class="form-text">How often the background worker checks all URLs (10–86400 seconds).</div>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{{ end }}
