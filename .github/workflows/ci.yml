# CI go-uptime: lint → параллельно test/build → затем integration, e2e и проверка compose.
# Триггеры: любой push и pull_request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Статический анализ: gofmt, go vet, кастомный golangci-lint с NilAway.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версия Go берётся из go.mod — совпадает с локальной и Docker.
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2

      - name: Format check
        # Пустой вывод gofmt -l = все файлы отформатированы.
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build custom golangci-lint with NilAway
        # Собирает ./custom-gcl по .custom-gcl.yml (NilAway не в стандартном бинарнике).
        run: golangci-lint custom

      - name: Lint
        run: ./custom-gcl run ./...

  # Unit/integration Go-тесты против сервиса PostgreSQL в GitHub Actions.
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Тесты создают/используют отдельную БД go-uptime-test (см. models/testdb_test.go).
      GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
      GO_UPTIME_SESSION_SECRET: test-secret
      GO_UPTIME_DATABASE_HOST: localhost
      GO_UPTIME_DATABASE_PORT: 5432
      GO_UPTIME_DATABASE_USER: postgres
      GO_UPTIME_DATABASE_PASSWORD: postgres
      GO_UPTIME_DATABASE_NAME: gouptime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  # Проверка, что бинарник собирается.
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o go-uptime .

  # Полный Docker-стек: миграции, старт app, проверка /health на порту 18081.
  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f docker-compose.with-infra.yml build app

      - name: Start database
        run: docker compose -f docker-compose.with-infra.yml up -d postgres --wait

      - name: Run migrations
        run: docker compose -f docker-compose.with-infra.yml run --rm app ./go-uptime db-goose-migrate

      - name: Start app
        run: docker compose -f docker-compose.with-infra.yml up -d app --wait

      - name: Check health endpoint
        # До 30 с ждём готовности; при ошибке печатаем логи compose.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18081/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker compose -f docker-compose.with-infra.yml logs
          exit 1

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.with-infra.yml down -v

  # Playwright e2e: поднимает свой стек через webServer (start-test-server.sh).
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          # Имя тестовой БД для скрипта start-test-server.sh.
          GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
        run: npm test

      - name: Upload Playwright report
        # Артефакт только при падении — HTML-отчёт Playwright для отладки.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Проверка, что production compose (внешний postgres в сети infra) валиден.
  docker-infra:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config
