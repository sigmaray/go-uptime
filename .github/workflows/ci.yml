name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build custom golangci-lint with NilAway
        run: golangci-lint custom

      - name: Lint
        run: ./custom-gcl run ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
      GO_UPTIME_SESSION_SECRET: test-secret
      GO_UPTIME_DATABASE_HOST: localhost
      GO_UPTIME_DATABASE_PORT: 5432
      GO_UPTIME_DATABASE_USER: postgres
      GO_UPTIME_DATABASE_PASSWORD: postgres
      GO_UPTIME_DATABASE_NAME: gouptime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o go-uptime .

  integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      GO_UPTIME_DATABASE_USER: gouptime
      GO_UPTIME_DATABASE_PASSWORD: ci-test-database-password
      GO_UPTIME_DATABASE_NAME: gouptime
      GO_UPTIME_SESSION_SECRET: ci-test-session-secret
      GO_UPTIME_HTTP_PORT: "18081"
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f docker-compose.with-infra.yml build app

      - name: Start database
        run: docker compose -f docker-compose.with-infra.yml up -d postgres --wait

      - name: Run migrations
        run: docker compose -f docker-compose.with-infra.yml run --rm app ./go-uptime db-goose-migrate

      - name: Start app
        run: docker compose -f docker-compose.with-infra.yml up -d app --wait

      - name: Check health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18081/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker compose -f docker-compose.with-infra.yml logs
          exit 1

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.with-infra.yml down -v

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker-infra:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.with-infra.yml config
          docker compose -f docker-compose.dev.yml config

      - name: Start app-only Compose with external PostgreSQL
        env:
          GO_UPTIME_HTTP_PORT: "18082"
        run: |
          docker network create infra
          docker run -d --name infra-postgres --network infra --network-alias postgresql \
            -e POSTGRES_USER=gouptime \
            -e POSTGRES_PASSWORD=change-me \
            -e POSTGRES_DB=gouptime \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec infra-postgres pg_isready -U gouptime -d gouptime; then
              break
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml up -d --build --wait
          docker compose -f docker-compose.yml exec -T go-uptime ./go-uptime db-goose-migrate
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:18082/health

      - name: Stop app-only Compose and external PostgreSQL
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v || true
          docker rm -f infra-postgres || true
          docker network rm infra || true

  docker-dev:
    runs-on: ubuntu-latest
    needs: build
    env:
      GO_UPTIME_DATABASE_USER: gouptime
      GO_UPTIME_DATABASE_PASSWORD: ci-test-database-password
      GO_UPTIME_DATABASE_NAME: gouptime
      GO_UPTIME_SESSION_SECRET: ci-test-session-secret
    steps:
      - uses: actions/checkout@v4

      - name: Start development Compose stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Apply migrations and check application health
        run: |
          docker compose -f docker-compose.dev.yml exec -T app go run . db-goose-migrate
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/health

      - name: Stop development Compose stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
