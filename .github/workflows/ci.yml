name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
      GO_UPTIME_SESSION_SECRET: test-secret
      GO_UPTIME_DATABASE_HOST: localhost
      GO_UPTIME_DATABASE_PORT: 5432
      GO_UPTIME_DATABASE_USER: postgres
      GO_UPTIME_DATABASE_PASSWORD: postgres
      GO_UPTIME_DATABASE_NAME: gouptime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o go-uptime .

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker compose -f docker-compose.with-infra.yml build app

      - name: Start database
        run: docker compose -f docker-compose.with-infra.yml up -d postgres --wait

      - name: Run migrations
        run: docker compose -f docker-compose.with-infra.yml run --rm app ./go-uptime db-goose-migrate

      - name: Start app
        run: docker compose -f docker-compose.with-infra.yml up -d app --wait

      - name: Check health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18081/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker compose -f docker-compose.with-infra.yml logs
          exit 1

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.with-infra.yml down -v

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          GO_UPTIME_TEST_DATABASE_NAME: go-uptime-test
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker-infra:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose config
        run: docker compose -f docker-compose.yml config
